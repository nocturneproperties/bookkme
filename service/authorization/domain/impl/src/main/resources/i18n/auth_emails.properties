sign_up.subject=Your BookkMe sign-up code
sign_up.body=Enter this code in the BookkMe app to finish creating your account. It is valid for 10 minutes.
sign_up.not_you=If you didn't try to sign up for BookkMe, ignore this email and no account will be created.
