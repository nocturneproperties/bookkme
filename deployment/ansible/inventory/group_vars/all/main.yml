deployment_dir: "{{ (inventory_dir ~ '/../..') | realpath }}"
remote_stacks_dir: /opt/bookk/stacks

allow_new_stacks: false

swarm_manager: "{{ groups['managers'] | first }}"
swarm_advertise_addr: "{{ hostvars[swarm_manager]['ansible_host'] }}"

swarm_networks:
  - operational
  - agent_network
  - monitoring
  - storage

swarm_secrets: "{{ vault_swarm_secrets }}"

stack_env: "{{ vault_stack_env | combine(vpn_stack_env) }}"

registry: ghcr.io
registry_username: "{{ vault_registry_username }}"
registry_password: "{{ vault_registry_password }}"

infra_stacks:
  vpn:
    name: vpn
    source: prod/vpn
    compose: [vpn-compose.yml]
  nginx:
    name: nginx
    source: prod/nginx
    compose: [nginx-compose.yml]
  orchestrator:
    name: orchestrator
    source: prod/orchestrator
    compose: [orchestrator-compose.yml]
    files:
      dozzle/users.actual.yaml: "{{ vault_dozzle_users }}"
      dozzle/session_secret: "{{ vault_dozzle_session_secret }}"
  monitoring:
    name: monitoring
    source: prod/monitoring
    compose: [monitoring-compose.yml]
    files:
      alertmanager/config.yml: "{{ vault_alertmanager_config }}"
  admin:
    name: admin
    source: adminpanel
    compose: [admin-compose.yml]
  backup:
    name: backup
    source: prod/backup
    compose: [backup-compose.yml]
    files:
      backup_db_password: "{{ vault_monolith_db_backup_password }}"

backup_host_dir: /srv/backups/bookk
backup_fetch_dir: "{{ (inventory_dir ~ '/..') | realpath }}/backups"
backup_public_key: "{{ deployment_dir }}/prod/backup/backup-public-key.asc"
node_exporter_textfile_dir: /var/lib/node_exporter/textfile
backup_stack_env:
  BACKUP_HOST_DIR: "{{ backup_host_dir }}"
  NODE_EXPORTER_TEXTFILE_DIR: "{{ node_exporter_textfile_dir }}"

vpn_clients:
  - admin-2
vpn_client_config_dir: "{{ (inventory_dir ~ '/..') | realpath }}/vpn-clients"
vpn_network_prefix: "172.16.91"
vpn_subnet: "{{ vpn_network_prefix }}.0/24"
vpn_address_template: "{{ vpn_network_prefix }}.x"
vpn_host_address: "{{ vpn_network_prefix }}.2"
vpn_stack_env:
  VPN_SUBNET: "{{ vpn_subnet }}"
  VPN_ADDRESS_TEMPLATE: "{{ vpn_address_template }}"
  VPN_HOST_ADDRESS: "{{ vpn_host_address }}"
  VPN_ENDPOINT: "{{ vault_hosts[groups['managers'] | first] }}"
vpn_host_interface: wg0

monolith:
  stack:
    name: monolith
    source: prod/monolith
    compose: [monolith-compose.yml]
  image: ghcr.io/nocturneproperties/bookkme-server

monolith_env:
  APPLICATION_DOMAIN_NAME: "{{ vault_stack_env.DOMAIN_NAME }}"
  APPLICATION_SERVICE_NAME: monolith
  APPLICATION_SERVICE_HOSTNAME: monolith.service
  APPLICATION_SERVICE_PORT: "80"
  APPLICATION_DB_URL: mariadb://monolith.database
  APPLICATION_DB_PORT: "3306"
  APPLICATION_DB_USER: monolith
  APPLICATION_DB_PASSWORD: "{{ vault_monolith_db_password }}"
  APPLICATION_REDIS_HOSTS: monolith.redis
  APPLICATION_REDIS_PORT: "6379"
  APPLICATION_REDIS_PASSWORD: "{{ vault_monolith_redis_password }}"
  APPLICATION_AUTH_SERVICE_HOSTNAME: monolith.service
  APPLICATION_USER_SERVICE_HOSTNAME: monolith.service
  APPLICATION_BUSINESS_SERVICE_HOSTNAME: monolith.service
  APPLICATION_APPOINTMENTS_SERVICE_HOSTNAME: monolith.service
  APPLICATION_NOTIFICATIONS_SERVICE_HOSTNAME: monolith.service
  APPLICATION_POSTMARK_SERVER_TOKEN: "{{ vault_postmark_server_token }}"
  APPLICATION_EMAIL_FROM: "notifications@{{ vault_stack_env.EMAIL_DOMAIN_NAME }}"
  APPLICATION_EMAIL_CODE_SECRET: "{{ vault_email_code_secret }}"
  APPLICATION_SUBJECT_MASTER_KEY: "{{ vault_subject_master_key }}"
  APPLICATION_BLIND_INDEX_KEY: "{{ vault_blind_index_key }}"
