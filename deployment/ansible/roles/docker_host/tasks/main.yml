- name: Require a Debian-based host
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: "{{ inventory_hostname }} runs {{ ansible_facts['distribution'] }}: the docker_host role only installs Docker and its Python libraries with apt"
    quiet: true

- name: Install Python libraries the Docker modules need
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-docker
      - python3-jsondiff
      - python3-yaml
      - python3-requests
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check whether Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Docker from the official repository
  when: docker_version.rc != 0
  block:
    - name: Add the Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true

- name: Keep Docker running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Free port 53 for the VPN's dnsmasq on managers
  when: inventory_hostname in groups['managers']
  block:
    - name: Create the systemd-resolved drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Turn off the systemd-resolved stub listener
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/no-stub-listener.conf
        content: |
          [Resolve]
          DNSStubListener=no
        owner: root
        group: root
        mode: "0644"
      register: resolved_stub_config

    - name: Resolve through the upstream servers instead of the stub
      ansible.builtin.file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true

    - name: Restart systemd-resolved to release port 53
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted
      when: resolved_stub_config is changed
