- name: Install the WireGuard tools
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Write the manager's VPN interface config
  ansible.builtin.copy:
    content: >-
      {{ vpn_client_configurations[vpn_host_client] | regex_replace('(?m)^DNS\s*=.*\n?', '') }}
    dest: "/etc/wireguard/{{ vpn_host_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true
  register: vpn_host_config

- name: Bring up the manager's VPN interface now and on boot
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ vpn_host_interface }}"
    enabled: true
    state: "{{ 'restarted' if vpn_host_config is changed else 'started' }}"

- name: Wait for the manager's VPN handshake
  ansible.builtin.command: "wg show {{ vpn_host_interface }} latest-handshakes"
  register: vpn_host_handshake
  until: vpn_host_handshake.stdout.split() | last | default('0') | int > 0
  retries: 12
  delay: 5
  changed_when: false
