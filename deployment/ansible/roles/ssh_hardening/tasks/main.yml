- name: Allow SSH logins by key only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      PubkeyAuthentication yes
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload the SSH server

- name: Check the complete SSH server config
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false

- name: Apply the SSH server config now
  ansible.builtin.meta: flush_handlers

- name: Read the effective SSH server settings
  ansible.builtin.command: /usr/sbin/sshd -T
  register: sshd_effective
  changed_when: false
  check_mode: false

- name: Require key-only SSH logins to be in effect
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in sshd_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in sshd_effective.stdout_lines"
      - "sshd_effective.stdout_lines | intersect(['permitrootlogin without-password', 'permitrootlogin prohibit-password']) | length > 0"
    fail_msg: "An earlier sshd_config or sshd_config.d file still allows password logins on {{ inventory_hostname }}"
    quiet: true
  when: not ansible_check_mode
