- name: Validate the requested version
  ansible.builtin.assert:
    that:
      - version is defined
      - version | string | length > 0
    fail_msg: "Pass -e version=<image tag of {{ monolith.image }}>"
    quiet: true

- name: Refuse a Hostinger Mail API token that would not send email
  ansible.builtin.assert:
    that: vault_hostinger_mail_token | default('CHANGE_ME', true) not in ['', 'CHANGE_ME', 'development_token']
    fail_msg: "Set vault_hostinger_mail_token to the Hostinger Mail API token with 'make vault-edit'; development_token logs every email code instead of sending it"
    quiet: true

- name: Refuse a missing sending mailbox
  ansible.builtin.assert:
    that: vault_hostinger_mailbox_id | default('CHANGE_ME', true) not in ['', 'CHANGE_ME']
    fail_msg: "Set vault_hostinger_mailbox_id to the resource ID (AC…) of the mailbox the app sends from with 'make vault-edit'"
    quiet: true

- name: Refuse missing personal data encryption keys
  ansible.builtin.assert:
    that:
      - vault_subject_master_key | default('', true) not in ['', 'CHANGE_ME', 'generated by import-secrets.py']
      - vault_blind_index_key | default('', true) not in ['', 'CHANGE_ME', 'generated by import-secrets.py']
    fail_msg: "Run 'make vault-update' to generate vault_subject_master_key and vault_blind_index_key; without them the app can't start"
    quiet: true

- name: Refuse Telegram sign-in without a token of the same bot for its notifications
  ansible.builtin.assert:
    that: >-
      vault_telegram_bot_id | default('', true) | string == ''
      or (vault_telegram_bot_token | default('', true)).split(':')[0] == vault_telegram_bot_id | string
    fail_msg: "Set vault_telegram_bot_token to the token of bot {{ vault_telegram_bot_id | default('') }} with 'make vault-edit'; without it accounts created through Telegram get no notifications, not even the warning before a dormant account is deleted"
    quiet: true

- name: Render the monolith environment and database users init files
  ansible.builtin.set_fact:
    monolith_env_file: "{{ lookup('ansible.builtin.template', 'monolith.env.j2') }}"
    monolith_users_init: "{{ lookup('ansible.builtin.template', 'users-init.sql.j2') }}"
  no_log: true

- name: "Deploy the monolith {{ version }} with registry credentials"
  block:
    - name: Log the manager in to the image registry
      community.docker.docker_login:
        registry_url: "{{ registry }}"
        username: "{{ registry_username }}"
        password: "{{ registry_password }}"
      no_log: true

    - name: "Deploy the monolith {{ version }}"
      ansible.builtin.include_role:
        name: stack
      vars:
        stack: "{{ monolith.stack }}"
        stack_files:
          monolith.env: "{{ monolith_env_file }}"
          db/users-init.sql: "{{ monolith_users_init }}"
        stack_env: "{{ monolith_env }}"
        stack_extra_env:
          APPLICATION_SERVICE_IMAGE: "{{ monolith.image }}"
          APPLICATION_SERVICE_VERSION: "{{ version | string }}"
          MONOLITH_UPDATE_ORDER: "{{ 'stop-first' if (stop_first | default(false) | bool) else 'start-first' }}"
          MONOLITH_DB_ROOT_PASSWORD: "{{ vault_monolith_db_root_password }}"
          MONOLITH_DB_EXPORTER_PASSWORD: "{{ vault_monolith_db_exporter_password }}"
        stack_prune: true
  always:
    - name: Log the manager out of the image registry
      community.docker.docker_login:
        registry_url: "{{ registry }}"
        state: absent
