- name: Validate the requested site version
  ansible.builtin.assert:
    that:
      - version is defined
      - version | string | length > 0
    fail_msg: "Pass -e version=<image tag of {{ site.image }}>"
    quiet: true

- name: "Deploy the site {{ version }} with registry credentials"
  block:
    - name: Log the manager in to the image registry
      community.docker.docker_login:
        registry_url: "{{ registry }}"
        username: "{{ registry_username }}"
        password: "{{ registry_password }}"
      no_log: true

    - name: "Deploy the site {{ version }}"
      ansible.builtin.include_role:
        name: stack
      vars:
        stack: "{{ site.stack }}"
        stack_env: {}
        stack_extra_env:
          SITE_IMAGE: "{{ site.image }}"
          SITE_VERSION: "{{ version | string }}"
        stack_prune: true
  always:
    - name: Log the manager out of the image registry
      community.docker.docker_login:
        registry_url: "{{ registry }}"
        state: absent
