version: "3.9"

networks:
  operational:
    external: true
  storage:
    external: true

volumes:
  admin_panel:
    driver: local

services:
  nocodb:
    image: nocodb/nocodb:2026.10.0
    environment:
      NC_ADMIN_EMAIL: "${NOCODB_ADMIN_EMAIL}"
      NC_ADMIN_PASSWORD: "${NOCODB_ADMIN_PASSWORD}"
      NC_DISABLE_TELE: "true"
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    networks:
      operational:
        aliases:
          - admin
      storage:
    volumes:
      - admin_panel:/usr/app/data/
    logging:
      options:
        max-size: 20m
        max-file: 5
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s