version: "3.9"

networks:
  operational:
    external: true

volumes:
  admin_panel:
    driver: local

services:
  nocodb:
    image: nocodb/nocodb:latest
    networks:
      operational:
        aliases:
          - admin
    volumes:
      - admin_panel:/usr/app/data/
    logging:
      options:
        max-size: 20m
        max-file: 5
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s