networks:
  operational:
    external: true

volumes:
  kafka_volume:
    driver: local

x-templates:
  replicated-deploy: &replicated
    logging:
      options:
        max-size: 20m
        max-file: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ node.role == worker ]
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

services:
  kafka:
    <<: *replicated
    image: apache/kafka-native:4.2.1
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ node.labels.kafka == true ]
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    networks:
      operational:
        aliases:
          - kafka
    volumes:
      - kafka_volume:/home/appuser
    environment:
      # KRaft
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Listeners
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Config
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /home/appuser/kafka-data
      # Native Image Memory Management
      KAFKA_OPTS: "-Xmx256M -Xms128M"
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"

  kafka-ui:
    <<: *replicated
    image: provectuslabs/kafka-ui:v0.7.2
    networks:
      operational:
        aliases:
          - ui.kafka
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_ID}
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USERNAME}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ node.role == manager ]
