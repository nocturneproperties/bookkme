global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "rules/*.yml"

# Scrape configurations
scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 30s
    basic_auth:
      username: admin
      password_file: /run/secrets/prometheus_password
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    scrape_interval: 10s
    dns_sd_configs:
      - names: ['tasks.node-exporter']
        type: A
        port: 9100

  - job_name: 'cadvisor'
    scrape_interval: 10s
    dns_sd_configs:
      - names: ['tasks.cadvisor']
        type: A
        port: 8080

  - job_name: 'monolith'
    dns_sd_configs:
      - names: ['tasks.monolith_monolith']
        type: A
        port: 80

  - job_name: 'mariadb'
    dns_sd_configs:
      - names: ['tasks.monolith_database-exporter']
        type: A
        port: 9104

  - job_name: 'valkey'
    dns_sd_configs:
      - names: ['tasks.monolith_redis-exporter']
        type: A
        port: 9121

  - job_name: 'loki'
    scrape_interval: 1m
    dns_sd_configs:
      - names: ['tasks.loki']
        type: A
        port: 3100
