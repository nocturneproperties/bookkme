version: "3.9"

networks:
  agent_network:
    external: true
  operational:
    external: true

volumes:
  nginx-cert:
    name: nginx-cert-${DOMAIN_NAME}
    driver: local
  nginx-site-cert:
    name: nginx-cert-${SITE_DOMAIN_NAME}
    driver: local
  acmesh-data:
    driver: local
configs:
  nginx_cert_wait_script:
    name: nginx-cert-wait-v3
    file: certificates/wait_for_cert.sh
  acme_certificates_script:
    name: acme-certificates-v2
    file: certificates/acme_certificates.sh

services:
  acme-sh:
    image: neilpang/acme.sh:3.1.2
    command: [ "sh", "/acme_certificates.sh" ]
    configs:
      - source: acme_certificates_script
        target: /acme_certificates.sh
        mode: 0555
    volumes:
      - acmesh-data:/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - operational
    depends_on:
      - nginx
    environment:
      ACME_ACCOUNT_EMAIL: antufeevmichaeloperational@gmail.com
      DOMAIN_NAME: ${DOMAIN_NAME}
      SITE_DOMAIN_NAME: ${SITE_DOMAIN_NAME}
      CF_Token: ${CLOUDFLARE_DNS_API_TOKEN}
      DEPLOY_DOCKER_CONTAINER_LABEL: sh.acme.autoload.target=nginx
      DEPLOY_DOCKER_CONTAINER_RELOAD_CMD: "service nginx force-reload"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
      placement:
        constraints: [ node.role == manager ]
      replicas: 1
      update_config:
        parallelism: 1
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
  nginx:
    image: nginx:1.29.4
    labels:
      sh.acme.autoload.target: nginx
    networks:
      - operational
      - agent_network
    ports:
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - nginx-cert:/etc/nginx/ssl/${DOMAIN_NAME}
      - nginx-site-cert:/etc/nginx/ssl/${SITE_DOMAIN_NAME}
      - ./templates:/etc/nginx/templates:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./static:/srv/static:ro
    configs:
      - source: nginx_cert_wait_script
        target: '/docker-entrypoint.d/wait_for_cert.sh'
        mode: 0744
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      SITE_DOMAIN_NAME: ${SITE_DOMAIN_NAME}
      VPN_SUBNET: ${VPN_SUBNET}
    logging:
      options:
        max-size: 20m
        max-file: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      placement:
        constraints: [node.role == manager]
      replicas: 1
      update_config:
        parallelism: 1
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s