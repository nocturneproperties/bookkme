version: '3.2'

secrets:
  dozzle-auth-v2:
    file: dozzle/users.actual.yaml
  dozzle-session-secret-v1:
    file: dozzle/session_secret

services:
  dozzle:
    image: amir20/dozzle:v11.3.1
    secrets:
      - source: dozzle-auth-v2
        target: /data/users.yml
      - source: dozzle-session-secret-v1
        target: /data/session_secret
    environment:
      DOZZLE_ENABLE_ACTIONS: "true"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_ENABLE_SHELL: "true"
      DOZZLE_MODE: "swarm"
      DOZZLE_AUTH_PROVIDER: "simple"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      agent_network:
        aliases:
          - dozzle
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      mode: global

networks:
  agent_network:
    external: true