networks:
  operational:
    external: true

volumes:
  etc_wireguard:
    driver: local

configs:
  dns-entrypoint:
    name: dns-entrypoint-v5
    file: dns/entrypoint.sh
  dns-config:
    name: dns-config-v7
    file: dns/dnsmasq.conf.template

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14@sha256:5f26407fd2ede54df76d63304ef184576a6c1bb73f934a58a11abdd852fab549
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.tcp_congestion_control=bbr
    volumes:
      - etc_wireguard:/etc/wireguard
    ports:
      - "51820:51820/udp"
    networks:
      operational:
        aliases:
          - vpn
    environment:
      LANG: en
      WG_HOST: vpn.${DOMAIN_NAME}
      PASSWORD_HASH: ${VPN_PASSWORD_HASH}
      UI_TRAFFIC_STATS: "true"
      UI_CHART_TYPE: 1
      UI_ENABLE_SORT_CLIENTS: "true"
      WG_DEFAULT_ADDRESS: ${VPN_ADDRESS_TEMPLATE}
      WG_ALLOWED_IPS: ${VPN_SUBNET}
      WG_MTU: 1280
      WG_PERSISTENT_KEEPALIVE: 25
      WG_DEFAULT_DNS: ${VPN_HOST_ADDRESS}
      WG_POST_UP: >-
        iptables-nft -t nat -A POSTROUTING -s ${VPN_SUBNET} -o eth0 -j MASQUERADE;
        iptables-nft -A INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables-nft -A FORWARD -i wg0 -j ACCEPT;
        iptables-nft -A FORWARD -o wg0 -j ACCEPT;
      WG_POST_DOWN: >-
        iptables-nft -t nat -D POSTROUTING -s ${VPN_SUBNET} -o eth0 -j MASQUERADE;
        iptables-nft -D INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables-nft -D FORWARD -i wg0 -j ACCEPT;
        iptables-nft -D FORWARD -o wg0 -j ACCEPT;
    logging:
      options:
        max-size: 20m
        max-file: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      mode: replicated
      replicas: 1
      placement:
        constraints: [ node.role == manager ]

  dns:
    image: strm/dnsmasq:latest
    entrypoint: ["./entrypoint.sh"]
    configs:
      - source: dns-config
        target: /etc/dnsmasq.conf.template
      - source: dns-entrypoint
        target: /entrypoint.sh
        mode: 0744
    ports:
      - target: 53
        published: 53
        protocol: udp
        mode: host
    networks:
      operational:
        aliases:
          - dns
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      VPN_HOST_ADDRESS: ${VPN_HOST_ADDRESS}
    cap_add:
      - NET_ADMIN
    logging:
      options:
        max-size: 10m
        max-file: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
      mode: replicated
      replicas: 1
      placement:
        constraints: [ node.role == manager ]