worker_processes auto;
events {
}
http {
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  resolver 127.0.0.11 valid=60s;

  limit_req_zone $binary_remote_addr zone=email_code_send:10m rate=2r/m;
  limit_req_zone $binary_remote_addr zone=email_code_redeem:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=sign_in_challenge:10m rate=10r/m;
  limit_req_status 429;
  limit_req_log_level warn;

  upstream auth.service {
    zone auth.service 64k;
    server auth.service:80 resolve;
    keepalive 16;
    keepalive_timeout 30s;
  }
  upstream user.service {
    zone user.service 64k;
    server user.service:80 resolve;
    keepalive 16;
    keepalive_timeout 30s;
  }
  upstream business.service {
    zone business.service 64k;
    server business.service:80 resolve;
    keepalive 16;
    keepalive_timeout 30s;
  }
  upstream appointments.service {
    zone appointments.service 64k;
    server appointments.service:80 resolve;
    keepalive 16;
    keepalive_timeout 30s;
  }
  upstream notifications.service {
    zone notifications.service 64k;
    server notifications.service:80 resolve;
    keepalive 16;
    keepalive_timeout 30s;
  }

  server {
    listen              80;
    server_name         localhost;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /.well-known/jwks.json {
        proxy_pass http://auth.service/jwks.json;
    }
    location = /api/auth/passkey/sign_in/challenge {
        limit_req zone=sign_in_challenge burst=20 nodelay;
        proxy_pass http://auth.service;
    }
    location = /api/auth/passkey/sign_up/challenge {
        limit_req zone=email_code_send burst=5 nodelay;
        proxy_pass http://auth.service;
    }
    location = /api/auth/email {
        limit_req zone=email_code_send burst=5 nodelay;
        proxy_pass http://auth.service;
    }
    location = /api/auth/sign_up {
        limit_req zone=email_code_redeem burst=10 nodelay;
        proxy_pass http://auth.service;
    }
    location = /api/auth/email/confirm {
        limit_req zone=email_code_redeem burst=10 nodelay;
        proxy_pass http://auth.service;
    }
    location /api/auth {
        proxy_pass http://auth.service;
    }
    location /api/user {
        proxy_pass http://user.service;
    }
    location /api/business {
        proxy_pass http://business.service;
    }
    location /api/appointments {
        proxy_pass http://appointments.service;
    }
    location /api/notifications {
        proxy_pass http://notifications.service;
    }
  }
}
