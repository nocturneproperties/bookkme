worker_processes auto;
events {
}
http {
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  resolver 127.0.0.11 valid=60s;

  limit_req_zone $binary_remote_addr zone=email_code_send:10m rate=2r/m;
  limit_req_zone $binary_remote_addr zone=email_code_redeem:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=sign_in_challenge:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=business_link_resolve:10m rate=30r/m;
  limit_req_status 429;
  map $http_origin $site_cors_origin {
      "~^http://localhost(:[0-9]+)?$" $http_origin;
      "https://local-app.bookkme.app" $http_origin;
      default "";
  }
  map $site_cors_origin $site_cors_methods {
      "" "";
      default "GET, POST, PUT, PATCH, DELETE, OPTIONS";
  }
  map $site_cors_origin $site_cors_headers {
      "" "";
      default "Authorization, Content-Type, Accept, Accept-Language, Idempotency-Key, User-Agent, X-Debug, X-App-Version, X-Platform";
  }
  map $site_cors_origin $site_cors_expose {
      "" "";
      default "Content-Disposition";
  }
  map $site_cors_origin $site_cors_max_age {
      "" "";
      default "86400";
  }
  limit_req_log_level warn;

  upstream auth.service {
    zone auth.service 64k;
    server auth.service:80 resolve;
    keepalive 16;
    keepalive_timeout 30s;
  }
  upstream user.service {
    zone user.service 64k;
    server user.service:80 resolve;
    keepalive 16;
    keepalive_timeout 30s;
  }
  upstream business.service {
    zone business.service 64k;
    server business.service:80 resolve;
    keepalive 16;
    keepalive_timeout 30s;
  }
  upstream appointments.service {
    zone appointments.service 64k;
    server appointments.service:80 resolve;
    keepalive 16;
    keepalive_timeout 30s;
  }
  upstream notifications.service {
    zone notifications.service 64k;
    server notifications.service:80 resolve;
    keepalive 16;
    keepalive_timeout 30s;
  }

  server {
    listen              80;
    server_name         localhost;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    add_header Access-Control-Allow-Origin $site_cors_origin always;
    add_header Access-Control-Allow-Methods $site_cors_methods always;
    add_header Access-Control-Allow-Headers $site_cors_headers always;
    add_header Access-Control-Expose-Headers $site_cors_expose always;
    add_header Access-Control-Max-Age $site_cors_max_age always;
    add_header Vary Origin always;
    if ($request_method = OPTIONS) {
        return 204;
    }

    location /.well-known/jwks.json {
        proxy_pass http://auth.service/jwks.json;
    }
    location = /api/auth/passkey/sign_in/challenge {
        limit_req zone=sign_in_challenge burst=20 nodelay;
        proxy_pass http://auth.service;
    }
    location = /api/auth/passkey/sign_up/challenge {
        limit_req zone=email_code_send burst=5 nodelay;
        proxy_pass http://auth.service;
    }
    location = /api/auth/email {
        limit_req zone=email_code_send burst=5 nodelay;
        proxy_pass http://auth.service;
    }
    location = /api/auth/sign_up {
        limit_req zone=email_code_redeem burst=10 nodelay;
        proxy_pass http://auth.service;
    }
    location = /api/auth/email/confirm {
        limit_req zone=email_code_redeem burst=10 nodelay;
        proxy_pass http://auth.service;
    }
    location /api/auth {
        proxy_pass http://auth.service;
    }
    location /api/user {
        proxy_pass http://user.service;
    }
    location /api/business/link/ {
        limit_req zone=business_link_resolve burst=30 nodelay;
        proxy_pass http://business.service;
    }
    location /api/business {
        proxy_pass http://business.service;
    }
    location /api/appointments {
        proxy_pass http://appointments.service;
    }
    location /api/notifications {
        proxy_pass http://notifications.service;
    }
  }
}
