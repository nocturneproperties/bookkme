secrets:
  signing_key_encryption_key:
    file: security/signing_key_encryption_key
  firebase_key:
    file: security/firebase-private-key.json

services:
  service-auth:
    image: bookkme-authorization:latest
    hostname: auth.service
    ports:
      - '8000:8000'
    env_file:
      - service/auth.env
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000 -ea"
      TZ: "UTC"
    secrets:
      - signing_key_encryption_key
    deploy:
      resources:
        limits:
          memory: 512M

  service-user:
    image: bookkme-user:latest
    hostname: user.service
    ports:
      - '8001:8000'
    env_file:
      - service/user.env
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:8000,server=y,suspend=n -ea"
      TZ: "UTC"
    deploy:
      resources:
        limits:
          memory: 512M

  service-business:
    image: bookkme-business:latest
    hostname: business.service
    ports:
      - '8002:8000'
    env_file:
      - service/business.env
    secrets:
      - signing_key_encryption_key
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:8000,server=y,suspend=n -ea"
      TZ: "UTC"
    deploy:
      resources:
        limits:
          memory: 512M

  service-appointments:
    image: bookkme-appointments:latest
    hostname: appointments.service
    ports:
      - '8003:8000'
    env_file:
      - service/appointments.env
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:8000,server=y,suspend=n -ea"
      TZ: "UTC"
    deploy:
      resources:
        limits:
          memory: 512M

  service-notifications:
    image: bookkme-notifications:latest
    hostname: notifications.service
    ports:
      - '8004:8000'
    env_file:
      - service/notifications.env
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:8000,server=y,suspend=n -ea"
      TZ: "UTC"
    secrets:
      - firebase_key
    deploy:
      resources:
        limits:
          memory: 512M