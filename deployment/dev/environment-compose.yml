  nginx:
    image: nginx:1.29.4
    hostname: nginx.local
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    volumes:
      - './${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf'
    deploy:
      resources:
        limits:
          memory: 50M
  kafka-volume-init:
    image: busybox
    user: root
    command: sh -c "chown -R 1000:1000 /var/lib/kafka/data"
    volumes:
      - kafka_volume:/var/lib/kafka/data
  kafka:
    image: apache/kafka-native:4.2.1
    hostname: kafka_local
    depends_on:
      - kafka-volume-init
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka_volume:/var/lib/kafka/data
    environment:
      # KRaft
      CLUSTER_ID: "R6YjCd49YUUaN6hC4tFH4Ljy"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka_local:9093
      KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: kafka_local:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Listeners
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_local:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Config
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Native Image Memory Management
      KAFKA_OPTS: "-Xmx256M -Xms128M"
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CLUSTERS_0_NAME: "R6YjCd49YUUaN6hC4tFH4Ljy"

  redis:
    image: valkey/valkey:8.1-alpine
    hostname: redis_local
    command:
      - valkey-server
      - --requirepass
      - "R6YjCd49YUUaN6hC4tFH4Ljy"
      - --appendonly
      - "yes"
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
    volumes:
      - valkey_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    deploy:
      resources:
        limits:
          memory: 100M

  redis-ui:
    image: redis/redisinsight:2.58
    depends_on:
      - redis
    ports:
      - '5540:5540'
    deploy:
      resources:
        limits:
          memory: 512M

  database:
    image: mariadb:11.8.3-ubi9
    hostname: mariadb_local
    ports:
      - '127.0.0.1:3307:3307'
    environment:
      MARIADB_ROOT_PASSWORD: "4FB3P4y3mbRKAxASQjM6cBA52qKMFDqW"
      MYSQL_TCP_PORT: 3307
    volumes:
      - database_data:/var/lib/mysql
      - './db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro'
      - './db/my.cnf:/etc/mysql/conf.d/encryption.cnf:ro'
      - './db/encryption.key:/etc/mysql/encryption/encryption.key:ro'
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u root --password=$$MARIADB_ROOT_PASSWORD
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  migration-database:
    image: mariadb:11.8.3-ubi9
    hostname: mariadb_local_migration
    ports:
      - '127.0.0.1:3308:3308'
    environment:
      MARIADB_ROOT_PASSWORD: "migration"
      MARIADB_USER: "migration"
      MARIADB_PASSWORD: "migration"
      MYSQL_TCP_PORT: 3308
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u root --password=$$MARIADB_ROOT_PASSWORD
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M