worker_processes auto;
events {
}
http {
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  resolver 127.0.0.11 valid=60s;

  limit_req_zone $binary_remote_addr zone=email_code_send:10m rate=2r/m;
  limit_req_zone $binary_remote_addr zone=email_code_redeem:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=sign_in_challenge:10m rate=10r/m;
  limit_req_status 429;
  limit_req_log_level warn;

  upstream monolith.service {
    zone monolith.service 64k;
    server monolith.service:80 resolve;
    keepalive 16;
    keepalive_timeout 30s;
  }

  server {
    listen              80;
    server_name         localhost;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /.well-known/jwks.json {
        proxy_pass http://monolith.service/jwks.json;
    }
    location = /api/auth/passkey/sign_in/challenge {
        limit_req zone=sign_in_challenge burst=20 nodelay;
        proxy_pass http://monolith.service;
    }
    location = /api/auth/passkey/sign_up/challenge {
        limit_req zone=email_code_send burst=10 nodelay;
        proxy_pass http://monolith.service;
    }
    location = /api/auth/email {
        limit_req zone=email_code_send burst=10 nodelay;
        proxy_pass http://monolith.service;
    }
    location = /api/auth/sign_up {
        limit_req zone=email_code_redeem burst=10 nodelay;
        proxy_pass http://monolith.service;
    }
    location = /api/auth/email/confirm {
        limit_req zone=email_code_redeem burst=10 nodelay;
        proxy_pass http://monolith.service;
    }
    location /api/ {
        proxy_pass http://monolith.service;
    }
  }
}
