name: Publish microservice
permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - 'auth/*'
      - 'user/*'
      - 'business/*'
      - 'appointment/*'
      - 'notification/*'

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the service and check the tag matches the project version
        id: service
        shell: bash
        run: |
          prefix="${GITHUB_REF_NAME%%/*}"
          tag_version="${GITHUB_REF_NAME#*/}"
          case "$prefix" in
            auth) module=authorization ;;
            user) module=user ;;
            business) module=business ;;
            appointment) module=appointments ;;
            notification) module=notifications ;;
            *) echo "::error::Unknown service tag prefix '$prefix'"; exit 1 ;;
          esac
          project_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version = \"$project_version\" in build.gradle.kts, the image would be published as $project_version"
            exit 1
          fi
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21.0.6'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-overwrite-existing: true

      - name: Publish image
        shell: bash
        run: ./gradlew ":service:${MODULE}:microservice:publishImage" --no-configuration-cache
        env:
          MODULE: ${{ steps.service.outputs.module }}
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        shell: bash
        run: echo "Published \`ghcr.io/nocturneprops/com.bookk.server.microservice.${{ steps.service.outputs.module }}:${{ steps.service.outputs.version }}\` (not deployed, prod runs the monolith)" >> "$GITHUB_STEP_SUMMARY"
