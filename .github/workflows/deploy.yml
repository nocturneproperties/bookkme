name: Deploy monolith
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag of ghcr.io/nocturneprops/com.bookk.server to deploy, e.g. 0.15.2
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy monolith ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: production
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/deployment/ansible/ansible.cfg
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SSH key
        shell: bash
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Install Ansible
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/0.5.11/install.sh | env UV_NO_MODIFY_PATH=1 sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install --python 3.12 ansible-core==2.21.5
          ansible-galaxy collection install community.docker:==5.4.0 community.general:==13.5.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy
        shell: bash
        working-directory: deployment/ansible
        run: ansible-playbook playbooks/deploy.yml -e version="$VERSION"
        env:
          VERSION: ${{ inputs.version }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/deploy_key
